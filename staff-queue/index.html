<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>DiamondEcho Staff | Inquiry Queue</title>
<link rel="stylesheet" href="./staff.css">
<script defer src="./config.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<main class="shell">
<p class="eyebrow">DiamondEcho staff</p><h1>Inquiry queue</h1>
<p class="intro">Restricted visitor requests. Use your approved staff account and authenticator. This site has no public analytics or session recording.</p>
<div id="alert" class="alert" role="alert" tabindex="-1" hidden></div>
<p id="notice" class="notice" role="status" hidden></p>
<section id="signin-section" aria-label="Staff access">
<form id="signin-form" class="card">
<label for="email">Staff email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="signin-button" type="submit">Sign in</button>
</form>
<form id="mfa-form" class="card" hidden>
<p id="enrollment" class="hint" hidden>First sign-in: add this secret to your authenticator, then enter its code. Never share the secret.</p>
<code id="secret" hidden></code>
<label for="code">Authenticator code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<button id="mfa-button" type="submit">Verify</button>
<button id="cancel-button" type="button">Cancel and sign out</button>
</form>
</section>
<section id="queue-section" aria-label="Staff inquiries" hidden>
<div class="controls"><p id="count" role="status"></p><div class="actions">
<button id="refresh-button" type="button">Refresh</button><button id="signout-button" type="button">Sign out</button>
</div></div><ul id="inquiries" class="inquiries"></ul>
</section>
</main></body></html>
