name: Security alert

# When a scheduled security scan or dependency audit fails on main, open an
# issue (or add to the open one) so the failure is seen and triaged. It never
# changes code or settings.
on:
  workflow_run:
    workflows: [Security scan, Production dependency audit]
    types: [completed]

permissions:
  contents: read

jobs:
  open-issue:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const label = 'security-alert';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205',
                description: 'Opened by the scheduled security checks' });
            }
            const line = `- ${run.name} failed on \`${run.head_sha.slice(0, 7)}\` (${run.created_at}): ${run.html_url}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 1 });
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body: line });
              return;
            }
            await github.rest.issues.create({ ...context.repo, labels: [label],
              title: 'Scheduled security check failed',
              body: [
                'A scheduled security check failed. Triage it with the playbook in `docs/security-operations.md`.',
                '', line, '',
                'Do not paste secret values, tokens or visitor data into this issue.',
              ].join('\n') });
