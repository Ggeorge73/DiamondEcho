name: SRE weekly report

# Every Monday morning: work out the SLO figures from the probe history on the
# sre-status branch, write last week's reliability report there, and open an
# issue labelled "sre-report" so a person reads it. It reads files and writes
# only to the sre-status branch and to issues. It never calls the live site,
# Google Cloud or Cloudflare. docs/sre/slo.md explains the figures.
on:
  schedule:
    # Two tries: GitHub delays and drops scheduled runs. The second finds the
    # week's report already saved and stops.
    - cron: '23 7 * * 1' # Mondays, 07:23 UTC (before the working day in Georgia)
    - cron: '23 11 * * 1' # Mondays, 11:23 UTC, in case the first did not run
  workflow_dispatch:
    inputs:
      rewrite:
        description: Write the report again even if this week's is already saved
        type: boolean
        default: false

permissions:
  contents: read

# Its own group, not the monitor's "sre-state": GitHub keeps only one pending
# run per group and replaces it with the newest, so a weekly run waiting
# behind a five-minute monitor run could be dropped. Two writers at once are
# handled by state-git.sh, which rebases and retries a push that lost a race.
concurrency:
  group: sre-weekly-report
  cancel-in-progress: false

jobs:
  report:
    name: Weekly reliability report
    if: github.repository == 'Ggeorge73/DiamondEcho'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # state-git.sh pushes the report to the sre-status branch
      issues: write # the "sre-report" issue
    steps:
      # No credentials are kept in this checkout. state-git.sh works in its
      # own clone and passes GITHUB_TOKEN to git itself, only in the steps
      # below that are given it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # A report from broken code is worse than none: test the three scripts first.
      - name: Test the SLO scripts
        run: node --test scripts/sre/slo.config.test.mjs scripts/sre/slo-calc.test.mjs scripts/sre/weekly-report.test.mjs

      # The week label comes from the script itself so the file name and the
      # report's title cannot disagree.
      - name: Work out which week to report
        id: week
        run: |
          week=$(node --input-type=module -e 'const { reportPeriod } = await import("./scripts/sre/weekly-report.mjs"); console.log(reportPeriod(Date.now()).week)')
          if ! [[ "$week" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then echo "Unexpected week label"; exit 2; fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "STATE_DIR=$RUNNER_TEMP/sre-state" >> "$GITHUB_ENV"

      - name: Check out the status branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/sre/state-git.sh checkout "$STATE_DIR"

      - name: Stop if this week's report is already saved
        id: done
        env:
          WEEK: ${{ steps.week.outputs.week }}
          REWRITE: ${{ inputs.rewrite == true }}
        run: |
          if [ -f "$STATE_DIR/reports/$WEEK.md" ] && [ "$REWRITE" != "true" ]; then
            echo "The report for $WEEK is already saved on the sre-status branch; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out the SLO figures (28 days)
        if: steps.done.outputs.skip != 'true'
        run: node scripts/sre/slo-calc.mjs --state-dir "$STATE_DIR" --window-days 28 --out "$STATE_DIR/slo.json"

      # --apply opens the issue (or comments on it if this week's report was
      # already posted).
      - name: Write the report and open its issue
        if: steps.done.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.week.outputs.week }}
        run: node scripts/sre/weekly-report.mjs --state-dir "$STATE_DIR" --out "$STATE_DIR/reports/$WEEK.md" --apply

      - name: Save to the status branch
        if: steps.done.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.week.outputs.week }}
        run: bash scripts/sre/state-git.sh commit "$STATE_DIR" "Weekly reliability report $WEEK"
