name: SRE chaos and resilience

# Breaks things on purpose, inside the GitHub runner only, to check that the
# service and the monitoring degrade the way docs/sre/chaos-and-game-days.md
# says they do:
#
# 1. backend/tests/test_resilience.py: every dependency failing, hanging or
#    answering nonsense, with no network. A test marked xfail is a weakness
#    already written down; the day one is fixed the run fails so its mark is
#    removed.
# 2. tests/chaos/run.mjs: the real API started on this runner (127.0.0.1),
#    killed, stopped, starved and flooded. Outbound connections from it are
#    refused, so it reaches no Google service, provider or website.
# 3. scripts/sre/fire-drill.mjs: hours of made-up monitor runs replayed
#    through the real alerting and rollback pipeline in a temporary folder,
#    without --apply, with no token, and with a fake gcloud that only answers
#    from a file.
#
# It never touches production, needs no secret and no setting, and changes
# nothing outside the runner. The JSON records are kept as an artifact for 30
# days. Weekly, and by hand from Actions > SRE chaos and resilience.
on:
  schedule:
    - cron: '41 9 * * 3' # Wednesdays, 09:41 UTC
  workflow_dispatch:
    inputs:
      experiments:
        description: Chaos experiments to run, comma-separated (node tests/chaos/run.mjs --list). Empty runs all.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sre-chaos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos:
    name: Resilience tests, local chaos experiments and the fire drill
    if: github.repository == 'Ggeorge73/DiamondEcho'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the API's Python packages (as CI does)
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare the record folder
        run: mkdir -p "$RUNNER_TEMP/chaos"

      # The runner's own safety rails are tested before anything is started.
      - name: Test the experiment runner and the fire drill
        shell: bash
        run: node --test tests/chaos/*.test.mjs scripts/sre/fire-drill.test.mjs

      - name: Dependency failures (backend/tests/test_resilience.py)
        if: always()
        shell: bash
        run: |
          python -m pytest backend/tests/test_resilience.py -q -rxX \
            --junitxml "$RUNNER_TEMP/chaos/test-resilience.xml" | tee "$RUNNER_TEMP/chaos/test-resilience.txt"
          {
            echo "### Dependency failures"
            echo '```'
            tail -n 30 "$RUNNER_TEMP/chaos/test-resilience.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Chaos experiments against the API on this runner
        if: always()
        shell: bash
        env:
          CHAOS_PYTHON: python
          EXPERIMENTS: ${{ inputs.experiments }}
        run: |
          only=()
          if [ -n "$EXPERIMENTS" ]; then only=(--only "$EXPERIMENTS"); fi
          node tests/chaos/run.mjs "${only[@]}" --out "$RUNNER_TEMP/chaos/chaos-results.json" | tee "$RUNNER_TEMP/chaos/chaos.txt"
          {
            echo "### Chaos experiments (127.0.0.1 on this runner)"
            echo '```'
            cat "$RUNNER_TEMP/chaos/chaos.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fire drill of the monitoring pipeline
        if: always()
        shell: bash
        run: |
          node scripts/sre/fire-drill.mjs --strict --out "$RUNNER_TEMP/chaos/fire-drill.json" | tee "$RUNNER_TEMP/chaos/fire-drill.txt"
          {
            echo "### Fire drill"
            echo '```'
            cat "$RUNNER_TEMP/chaos/fire-drill.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sre-chaos-${{ github.run_id }}
          path: ${{ runner.temp }}/chaos/
          retention-days: 30
          if-no-files-found: warn
