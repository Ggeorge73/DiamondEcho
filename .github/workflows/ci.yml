name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm version
        run: npm install --global npm@10.9.3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace frontend
        env:
          CI: true

      - name: Build production frontend
        run: npm run build
        env:
          CI: true

      - name: Page weight within budget (scripts/sre/perf-budget.json)
        run: node scripts/sre/perf-budget.mjs --summary "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Build Cloud Run container (no push or deployment)
        run: docker build -t diamondecho-api:ci backend

      - name: Smoke-test unconfigured container
        run: |
          docker run -d --name diamondecho-api -p 8080:8080 diamondecho-api:ci
          for attempt in {1..20}; do
            if curl --fail http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/health
          docker stop diamondecho-api

  staff:
    name: Staff tests and isolated build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - run: npm run test:staff
      - run: npm run build:staff
      - name: Build configured bundle with synthetic public configuration
        run: npm run build:staff
        env:
          STAFF_QUEUE_ENABLED: 'true'
          STAFF_API_ORIGIN: https://api.example.com
          STAFF_ORIGIN: https://staff.example.com
          PUBLIC_ORIGIN: https://public.example.com
          FIREBASE_PROJECT_ID: demo-diamondecho
          FIREBASE_AUTH_DOMAIN: demo-diamondecho.firebaseapp.com
          FIREBASE_WEB_API_KEY: synthetic-ci-public-key
          FIREBASE_WEB_APP_ID: synthetic-ci-public-app

  firestore:
    name: Firestore emulator contracts and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Test rules and real Firestore transactions without cloud credentials
        run: npx --yes firebase-tools@15.31.0 emulators:exec --project demo-diamondecho --only firestore "node --test staff-queue/firestore-rules.test.mjs && python -m pytest backend/tests/test_firestore_emulator.py -q"

  sre:
    name: SRE automation tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Every *.test.mjs of the SRE automation (scripts/sre/README.md is the
      # contract between them). None of these tests touches the network.
      - name: Monitoring, alerting, remediation, release, status page, load and chaos tests
        run: |
          files=$(find scripts/sre deploy/monitoring status-page tests/load tests/chaos scripts/copy-build.test.mjs \
            -name '*.test.mjs' -not -path '*/node_modules/*' 2>/dev/null | sort || true)
          echo "$files"
          node --test $files
      - name: Shell scripts parse and pass shellcheck (errors only)
        run: |
          files=$(find scripts/sre deploy/monitoring -name '*.sh' | sort)
          for f in $files; do bash -n "$f"; done
          shellcheck -S error $files
