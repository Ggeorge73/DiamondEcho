<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a141f" />
        <meta name="description" content="DiamondEcho Private Real Estate — residences, rentals, investments, and advisory with institutional intelligence." />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <!--
        The description above and the title below are fallbacks for the
        development server. The build gives every public page its own, with
        its address for search engines, link-preview tags and business
        details (scripts/prerender.mjs, src/lib/pageMeta.js).
        -->
        <title>DiamondEcho | Private Real Estate</title>
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <!-- The two type families come from Google Fonts (src/index.css); opening the connections early shortens the wait for them. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Sections fade in as they are scrolled to, which needs the script. Without it they are simply shown. -->
        <noscript><style>[data-reveal] { opacity: 1 !important; transform: none !important; }</style></noscript>
        <!--
        DE-18: no analytics, session-recording, advertising or builder script loads
        here. Do not add one without Gbenga's approval and a matching update to
        the Privacy page (src/pages/Policies.jsx).
        -->
        <!--
        These two scripts have been added for the Visual Edits, please do not edit or remove them
        -->
        <script>
            // Only load visual edit scripts when inside an iframe and visual edits are enabled
            if (window.self !== window.top && '%REACT_APP_ENABLE_VISUAL_EDITS%' === 'true') {
                // Load debug monitor script
                var debugScript = document.createElement('script');
                debugScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugScript);

                // Configure Tailwind
                window.tailwind = window.tailwind || {};
                tailwind.config = {
                    corePlugins: { preflight: false },
                };

                // Load Tailwind CDN
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <noscript data-shell-note style="display: block; padding: 14px 22px; color: #8ba0b3; font-size: 13px">The property search, the calculators and the request forms on this site need JavaScript switched on.</noscript>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
